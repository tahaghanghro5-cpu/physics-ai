    function submitTutorQuestion(text) {
      const q = (text || '').trim();
      if (!q) {
        showToast('Please enter a Physics question first.', 'error');
        return;
      }
      tutorState.askedQuestion = q;
      tutorState.isThinking = true;
      tutorState.importantOnly = false;
      tutorState.examOnly = false;
      renderCurrentView();

      setTimeout(() => {
        const el = document.getElementById('tutor-thinking-anchor');
        if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
      }, 30);

      setTimeout(() => {
        tutorState.isThinking = false;
        tutorState.lesson = buildDetailedLesson(q);
        appState.studiedMin = (appState.studiedMin || 0) + 3;
        saveState();
        renderCurrentView();
        setTimeout(() => {
          const el = document.getElementById('tutor-answer-anchor');
          if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }, 40);
      }, 600);
    }

    function start3DCanvasLoop() {
      if (viewer3DState.animFrame) cancelAnimationFrame(viewer3DState.animFrame);
      let phase = 0;

      function project3D(x, y, z, w, h) {
        const cy = Math.cos(viewer3DState.rotY), sy = Math.sin(viewer3DState.rotY);
        const cx = Math.cos(viewer3DState.rotX), sx = Math.sin(viewer3DState.rotX);
        const x1 = x * cy - z * sy;
        const z1 = x * sy + z * cy;
        const y2 = y * cx - z1 * sx;
        const z2 = y * sx + z1 * cx;
        const fov = 340 * viewer3DState.zoom;
        const scale = fov / (fov + z2 + 180);
        return { sx: w / 2 + x1 * scale, sy: h / 2 + y2 * scale, scale };
      }

      function drawTag(ctx, text, x, y, color = '#e2e8f0') {
        if (!viewer3DState.showLabels) return;
        ctx.font = '700 10px Inter, sans-serif';
        const padX = 8;
        const tw = ctx.measureText(text).width;
        const bw = tw + padX * 2;
        const bh = 20;
        ctx.fillStyle = 'rgba(13, 20, 37, 0.88)';
        ctx.strokeStyle = 'rgba(71, 85, 105, 0.7)';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.roundRect(x - bw / 2, y - bh / 2, bw, bh, 10);
        ctx.fill();
        ctx.stroke();
        ctx.fillStyle = color;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(text, x, y);
      }

      function frame() {
        const canvas = document.getElementById('physics-3d-canvas');
        if (!canvas || currentView !== 'viewer3d' || viewer3DState.subTab !== '3d') return;
        const dpr = window.devicePixelRatio || 1;
        const rect = canvas.getBoundingClientRect();
        if (canvas.width !== Math.round(rect.width * dpr) || canvas.height !== Math.round(rect.height * dpr)) {
          canvas.width = Math.round(rect.width * dpr);
          canvas.height = Math.round(rect.height * dpr);
        }
        const ctx = canvas.getContext('2d');
        ctx.save();
        ctx.scale(dpr, dpr);
        const w = rect.width;
        const h = rect.height;

        ctx.fillStyle = '#070c18';
        ctx.fillRect(0, 0, w, h);

        if (viewer3DState.playing) phase += 0.045;
        const m = viewer3DState.modelId;

        if (m === 'wave' || m === 'sound') {
          const pLeft = project3D(-145, 0, 0, w, h);
          const pRight = project3D(145, 0, 0, w, h);
          ctx.strokeStyle = 'rgba(100,116,139,0.55)';
          ctx.setLineDash([4, 4]);
          ctx.lineWidth = 1.2;
          ctx.beginPath();
          ctx.moveTo(pLeft.sx, pLeft.sy);
          ctx.lineTo(pRight.sx, pRight.sy);
          ctx.stroke();
          ctx.setLineDash([]);

          ctx.strokeStyle = '#22d3ee';
          ctx.lineWidth = 2.6;
          ctx.beginPath();
          let crestPt = null, troughPt = null, crest2Pt = null;
          for (let i = 0; i <= 120; i++) {
            const u = -140 + (i / 120) * 280;
            const ang = (u / 44) - phase;
            const y = -Math.sin(ang) * 44;
            const z = Math.cos(ang) * 14;
            const pt = project3D(u, y, z, w, h);
            if (i === 0) ctx.moveTo(pt.sx, pt.sy);
            else ctx.lineTo(pt.sx, pt.sy);
            if (i === 28) crestPt = pt;
            if (i === 56) troughPt = pt;
            if (i === 84) crest2Pt = pt;
          }
          ctx.stroke();

          if (crestPt) {
            ctx.fillStyle = '#34d399';
            ctx.beginPath(); ctx.arc(crestPt.sx, crestPt.sy, 4.5, 0, Math.PI * 2); ctx.fill();
            drawTag(ctx, 'Crest', crestPt.sx, crestPt.sy - 20, '#6ee7b7');
            drawTag(ctx, 'Amplitude A', crestPt.sx + 16, crestPt.sy + 26, '#c084fc');
          }
          if (troughPt) {
            ctx.fillStyle = '#f472b6';
            ctx.beginPath(); ctx.arc(troughPt.sx, troughPt.sy, 4.5, 0, Math.PI * 2); ctx.fill();
            drawTag(ctx, 'Trough', troughPt.sx, troughPt.sy + 20, '#f9a8d4');
          }
          if (crest2Pt) {
            ctx.fillStyle = '#34d399';
            ctx.beginPath(); ctx.arc(crest2Pt.sx, crest2Pt.sy, 4.5, 0, Math.PI * 2); ctx.fill();
            drawTag(ctx, 'Wave travel →', crest2Pt.sx, crest2Pt.sy - 18, '#38bdf8');
          }
          drawTag(ctx, 'Wavelength λ', w / 2, h - 42, '#cbd5e1');
        } else if (m === 'pendulum') {
          const swingAngle = Math.sin(phase * 0.9) * 0.45;
          const len = 115;
          const pivot = project3D(0, -75, 0, w, h);
          const bobX = Math.sin(swingAngle) * len;
          const bobY = -75 + Math.cos(swingAngle) * len;
          const bob = project3D(bobX, bobY, Math.sin(swingAngle) * 18, w, h);

          const bL = project3D(-65, -75, 0, w, h);
          const bR = project3D(65, -75, 0, w, h);
          ctx.strokeStyle = '#64748b';
          ctx.lineWidth = 4;
          ctx.beginPath(); ctx.moveTo(bL.sx, bL.sy); ctx.lineTo(bR.sx, bR.sy); ctx.stroke();

          const eqBot = project3D(0, 48, 0, w, h);
          ctx.strokeStyle = 'rgba(100,116,139,0.5)';
          ctx.setLineDash([4, 4]);
          ctx.lineWidth = 1.2;
          ctx.beginPath(); ctx.moveTo(pivot.sx, pivot.sy); ctx.lineTo(eqBot.sx, eqBot.sy); ctx.stroke();
          ctx.setLineDash([]);

          ctx.strokeStyle = '#22d3ee';
          ctx.lineWidth = 2.2;
          ctx.beginPath(); ctx.moveTo(pivot.sx, pivot.sy); ctx.lineTo(bob.sx, bob.sy); ctx.stroke();

          const grad = ctx.createRadialGradient(bob.sx - 4, bob.sy - 4, 2, bob.sx, bob.sy, 15);
          grad.addColorStop(0, '#c7d2fe');
          grad.addColorStop(1, '#6366f1');
          ctx.fillStyle = grad;
          ctx.beginPath(); ctx.arc(bob.sx, bob.sy, 14, 0, Math.PI * 2); ctx.fill();

          drawTag(ctx, 'Pivot θ', pivot.sx, pivot.sy + 18, '#fbbf24');
          drawTag(ctx, 'Length L', (pivot.sx + bob.sx) / 2 + 34, (pivot.sy + bob.sy) / 2, '#38bdf8');
          drawTag(ctx, 'Bob (mass m)', bob.sx, bob.sy + 26, '#e2e8f0');
        } else if (m === 'coulomb') {
          const pulse = Math.sin(phase) * 10;
          const q1 = project3D(-72 - pulse * 0.4, 0, 0, w, h);
          const q2 = project3D(72 + pulse * 0.4, 0, 0, w, h);

          ctx.strokeStyle = '#64748b';
          ctx.setLineDash([4, 4]);
          ctx.beginPath(); ctx.moveTo(q1.sx, q1.sy); ctx.lineTo(q2.sx, q2.sy); ctx.stroke();
          ctx.setLineDash([]);

          ctx.strokeStyle = '#22d3ee';
          ctx.lineWidth = 2.4;
          ctx.beginPath(); ctx.moveTo(q1.sx - 22, q1.sy); ctx.lineTo(q1.sx - 56, q1.sy); ctx.stroke();
          ctx.beginPath(); ctx.moveTo(q2.sx + 22, q2.sy); ctx.lineTo(q2.sx + 56, q2.sy); ctx.stroke();

          ctx.fillStyle = '#0ea5e9';
          ctx.beginPath(); ctx.arc(q1.sx, q1.sy, 20, 0, Math.PI * 2); ctx.fill();
          ctx.fillStyle = '#a855f7';
          ctx.beginPath(); ctx.arc(q2.sx, q2.sy, 20, 0, Math.PI * 2); ctx.fill();

          drawTag(ctx, '+q1', q1.sx, q1.sy, '#ffffff');
          drawTag(ctx, '+q2', q2.sx, q2.sy, '#ffffff');
          drawTag(ctx, 'Distance r', w / 2, q1.sy - 24, '#cbd5e1');
          drawTag(ctx, 'F12 ←', q1.sx - 44, q1.sy - 20, '#38bdf8');
          drawTag(ctx, '→ F21', q2.sx + 44, q2.sy - 20, '#38bdf8');
        } else if (m === 'circuit') {
          const corners = [
            project3D(-105, -52, 0, w, h),
            project3D(105, -52, 0, w, h),
            project3D(105, 52, 0, w, h),
            project3D(-105, 52, 0, w, h)
          ];
          ctx.strokeStyle = '#38bdf8';
          ctx.lineWidth = 2.2;
          ctx.beginPath();
          corners.forEach((c, idx) => idx === 0 ? ctx.moveTo(c.sx, c.sy) : ctx.lineTo(c.sx, c.sy));
          ctx.closePath();
          ctx.stroke();

          for (let k = 0; k < 8; k++) {
            const t = ((phase * 0.25 + k / 8) % 1);
            let ex = 0, ey = 0;
            if (t < 0.25) { ex = -105 + (t / 0.25) * 210; ey = -52; }
            else if (t < 0.5) { ex = 105; ey = -52 + ((t - 0.25) / 0.25) * 104; }
            else if (t < 0.75) { ex = 105 - ((t - 0.5) / 0.25) * 210; ey = 52; }
            else { ex = -105; ey = 52 - ((t - 0.75) / 0.25) * 104; }
            const ep = project3D(ex, ey, 0, w, h);
            ctx.fillStyle = '#fbbf24';
            ctx.beginPath(); ctx.arc(ep.sx, ep.sy, 3.8, 0, Math.PI * 2); ctx.fill();
          }

          drawTag(ctx, 'Battery V', corners[0].sx, (corners[0].sy + corners[3].sy) / 2, '#34d399');
          drawTag(ctx, 'Resistor R1', w / 2 - 42, corners[0].sy, '#38bdf8');
          drawTag(ctx, 'Resistor R2', w / 2 + 45, corners[0].sy, '#c084fc');
        } else if (m === 'lens') {
          const top = project3D(0, -68, 0, w, h);
          const bot = project3D(0, 68, 0, w, h);
          const foc = project3D(95, 0, 0, w, h);

          ctx.fillStyle = 'rgba(56, 189, 248, 0.22)';
          ctx.strokeStyle = '#38bdf8';
          ctx.lineWidth = 2.2;
          ctx.beginPath();
          ctx.ellipse(top.sx, (top.sy + bot.sy) / 2, 16 * viewer3DState.zoom, Math.abs(bot.sy - top.sy) / 2, 0, 0, Math.PI * 2);
          ctx.fill();
          ctx.stroke();

          [-38, 0, 38].forEach(ry => {
            const p1 = project3D(-130, ry, 0, w, h);
            const p2 = project3D(0, ry, 0, w, h);
            const p3 = project3D(135, -ry * 0.42, 0, w, h);
            ctx.strokeStyle = '#22d3ee';
            ctx.lineWidth = 1.8;
            ctx.beginPath();
            ctx.moveTo(p1.sx, p1.sy);
            ctx.lineTo(p2.sx, p2.sy);
            ctx.lineTo(p3.sx, p3.sy);
            ctx.stroke();
          });

          ctx.fillStyle = '#fbbf24';
          ctx.beginPath(); ctx.arc(foc.sx, foc.sy, 5, 0, Math.PI * 2); ctx.fill();
          drawTag(ctx, 'Convex Lens', top.sx, top.sy - 14, '#38bdf8');
          drawTag(ctx, 'Principal Focus F', foc.sx, foc.sy + 20, '#fbbf24');
        } else if (m === 'magnet') {
          const nPole = project3D(-45, 0, 0, w, h);
          const sPole = project3D(45, 0, 0, w, h);
          ctx.strokeStyle = 'rgba(56, 189, 248, 0.65)';
          ctx.lineWidth = 1.5;
          [42, 68].forEach(ry => {
            ctx.beginPath();
            ctx.ellipse((nPole.sx + sPole.sx) / 2, nPole.sy, 95 * viewer3DState.zoom, ry * viewer3DState.zoom, 0, 0, Math.PI * 2);
            ctx.stroke();
          });
          drawTag(ctx, 'North (N)', nPole.sx - 18, nPole.sy, '#818cf8');
          drawTag(ctx, 'South (S)', sPole.sx + 18, sPole.sy, '#f472b6');
        } else {
          const slide = Math.sin(phase) * 42;
          const blk = project3D(slide, 10, 0, w, h);
          const gL = project3D(-125, 34, 0, w, h);
          const gR = project3D(125, 34, 0, w, h);
          ctx.strokeStyle = '#475569';
          ctx.lineWidth = 2;
          ctx.beginPath(); ctx.moveTo(gL.sx, gL.sy); ctx.lineTo(gR.sx, gR.sy); ctx.stroke();

          ctx.fillStyle = '#1e293b';
          ctx.strokeStyle = '#38bdf8';
          ctx.lineWidth = 2.2;
          ctx.beginPath();
          ctx.roundRect(blk.sx - 34, blk.sy - 22, 68, 44, 8);
          ctx.fill();
          ctx.stroke();

          drawTag(ctx, 'Mass m', blk.sx, blk.sy, '#e2e8f0');
          drawTag(ctx, 'Normal N ↑', blk.sx, blk.sy - 42, '#38bdf8');
          drawTag(ctx, 'Force F →', blk.sx + 68, blk.sy, '#22d3ee');
          drawTag(ctx, 'Weight W = mg ↓', blk.sx, blk.sy + 44, '#c084fc');
        }

        ctx.font = '600 10px Inter, sans-serif';
        ctx.fillStyle = 'rgba(148, 163, 184, 0.85)';
        ctx.textAlign = 'center';
        ctx.fillText('Drag to rotate · pinch/scroll to zoom · two fingers to pan', w / 2, h - 12);

        ctx.restore();
        viewer3DState.animFrame = requestAnimationFrame(frame);
      }

      viewer3DState.animFrame = requestAnimationFrame(frame);
    }

    function bind3DCanvasGestures() {
      const canvas = document.getElementById('physics-3d-canvas');
      if (!canvas) return;
      let dragging = false, lastX = 0, lastY = 0;

      canvas.onpointerdown = (e) => {
        dragging = true;
        lastX = e.clientX;
        lastY = e.clientY;
        canvas.setPointerCapture(e.pointerId);
      };
      canvas.onpointermove = (e) => {
        if (!dragging) return;
        const dx = e.clientX - lastX;
        const dy = e.clientY - lastY;
        lastX = e.clientX;
        lastY = e.clientY;
        viewer3DState.rotY += dx * 0.012;
        viewer3DState.rotX = Math.max(-1.1, Math.min(1.1, viewer3DState.rotX + dy * 0.012));
      };
      canvas.onpointerup = () => { dragging = false; };
      canvas.onwheel = (e) => {
        e.preventDefault();
        viewer3DState.zoom = Math.max(0.65, Math.min(1.65, viewer3DState.zoom - e.deltaY * 0.001));
      };
    }

    function solvePhysicsNumericalText(raw) {
      const txt = (raw || '').trim();
      if (!txt) return null;
      const nums = (txt.match(/-?\d+(\.\d+)?/g) || []).map(Number);
      const low = txt.toLowerCase();
      if (low.includes('accelerat') || (low.includes('m/s') && nums.length >= 2)) {
        const a = nums[0] || 2, t = nums[1] || 5;
        const vf = (a * t).toFixed(2);
        const s = (0.5 * a * t * t).toFixed(2);
        return {
          given: `Initial velocity vi = 0 m/s, Acceleration a = ${a} m/s², Time t = ${t} s`,
          formula: 'vf = vi + a × t   &   S = vi×t + ½ a t²',
          steps: [`vf = 0 + (${a} × ${t}) = ${vf} m/s`, `S = 0 + 0.5 × ${a} × (${t})² = ${s} m`],
          answer: `Final Velocity vf = ${vf} m/s, Distance S = ${s} m`
        };
      }
      if (low.includes('battery') || low.includes('resistor') || low.includes('ohm')) {
        const v = nums[0] || 12, r = nums[1] || 6;
        const i = (v / (r || 1)).toFixed(2);
        return {
          given: `Voltage V = ${v} V, Resistance R = ${r} Ω`,
          formula: 'I = V / R',
          steps: [`I = ${v} / ${r} = ${i} A`],
          answer: `Current I = ${i} A`
        };
      }
      const m = nums[0] || 5, f = nums[1] || 20;
      const a = (f / (m || 1)).toFixed(2);
      return {
        given: `Mass m = ${m} kg, Force F = ${f} N`,
        formula: 'a = F / m',
        steps: [`a = ${f} / ${m} = ${a} m/s²`],
        answer: `Acceleration a = ${a} m/s²`
      };
    }

            <div>
              <label class="text-[10px] font-bold text-slate-400">Daily goal (minutes)</label>
              <input id="set-goal" type="number" value="${appState.dailyGoalMin || 30}" class="w-full mt-1 px-3.5 py-2.5 rounded-xl bg-[#090f1d] border border-slate-800 text-white font-bold" />
            </div>
            <button onclick="appState.studentName=document.getElementById('set-name').value; appState.studentClass=document.getElementById('set-class').value; appState.dailyGoalMin=Number(document.getElementById('set-goal').value)||30; saveState(); updateHeaderAvatar(); showToast('Settings saved!','success'); renderCurrentView();"
              class="px-5 py-2.5 rounded-full bg-cyan-400 text-[#080d1a] font-black">Save changes</button>
          </div>
          <div class="p-4 rounded-2xl bg-[#0d1425] border border-slate-800 space-y-2.5 text-xs">
            <p class="font-extrabold text-white">Appearance</p>
            <div class="flex gap-2">
              <button onclick="if(appState.theme!=='dark') toggleTheme();" class="px-4 py-2 rounded-full font-bold ${appState.theme==='dark'?'bg-cyan-500/20 text-cyan-300 border border-cyan-500/50':'bg-[#090f1d] text-slate-400'}">🌙 Dark</button>
              <button onclick="if(appState.theme==='dark') toggleTheme();" class="px-4 py-2 rounded-full font-bold ${appState.theme==='light'?'bg-cyan-500/20 text-cyan-300 border border-cyan-500/50':'bg-[#090f1d] text-slate-400'}">☀️ Light</button>
            </div>
          </div>
          <div class="p-4 rounded-2xl bg-[#0d1425] border border-slate-800 space-y-2 text-xs">
            <p class="font-extrabold text-white">Introduction</p>
            <button onclick="openOnboarding(0)" class="px-4 py-2 rounded-full bg-[#090f1d] border border-slate-800 font-bold text-slate-200">🧭 Take App Tour</button>
          </div>
        </div>
      `;
    }

    function renderNotesPage(container) {
      container.innerHTML = `
        <div class="space-y-4">
          <div class="flex items-center justify-between">
            <div>
              <p class="text-[10px] font-extrabold uppercase tracking-widest text-cyan-400">NOTES AND REVISION</p>
              <h1 class="text-2xl font-black text-white">Everything you have saved</h1>
            </div>
            <button onclick="const t=prompt('Note title:')||'Physics Note'; const c=prompt('Note summary:')||'Key formula and definition'; appState.notes.unshift({id:'n_'+Date.now(),title:t,content:c,date:'2026-11-22'}); saveState(); renderCurrentView();"
              class="px-3.5 py-2 rounded-full bg-cyan-400 text-[#080d1a] text-xs font-black">+ New note</button>
          </div>
          ${appState.notes.length === 0 ? `
            <div class="p-6 rounded-2xl bg-[#0d1425] border border-slate-800 text-center text-xs text-slate-400">
              No notes here yet. Save an explanation from the tutor, or write your first note.
            </div>
          ` : appState.notes.map((n, idx) => `
            <div class="p-4 rounded-2xl bg-[#0d1425] border border-slate-800 space-y-1.5">
              <div class="flex justify-between items-center">
                <p class="text-sm font-extrabold text-cyan-400">${n.title}</p>
                <button onclick="appState.notes.splice(${idx},1); saveState(); renderCurrentView();" class="text-xs text-rose-400 font-bold">Delete</button>
              </div>
              <p class="text-xs text-slate-300 leading-relaxed">${n.content}</p>
            </div>
          `).join('')}
        </div>
      `;
    }

    // =========================================================================
    // 7. SIDEBAR NAVIGATION, MODALS, VOICE & BOOTSTRAP
    // =========================================================================
    const NAV_GROUPS = [
      {
        heading: 'START HERE',
        items: [
          { key: 'tutor', icon: 'sparkles', label: 'AI Physics Tutor', sub: 'Ask any question, get a diagram' },
          { key: 'chapters', icon: 'book-open', label: 'Chapters', sub: 'Sindh Board chapters and topics' },
          { key: 'dashboard', icon: 'layout-grid', label: 'Dashboard', sub: 'Your day at a glance' }
        ]
      },
      {
        heading: 'TOOLS',
        items: [
          { key: 'solver', icon: 'calculator', label: 'Numerical Solver', sub: 'Step-by-step numericals' },
          { key: 'camera', icon: 'camera', label: 'Camera Solver', sub: 'Photo of a question, solved' },
          { key: 'lab', icon: 'flask-conical', label: 'Virtual Lab', sub: 'Try experiments safely' },
          { key: 'viewer3d', icon: 'box', label: '3D Model Lab', sub: 'Rotate and inspect models' },
          { key: 'formulas', icon: 'sigma', label: 'Formula Library', sub: 'All formulas in one place' },
          { key: 'diagrams', icon: 'line-chart', label: 'Diagrams & Graphs', sub: 'Learn from labelled visuals' }
        ]
      },
      {
        heading: 'PRACTICE',
        items: [
          { key: 'quiz', icon: 'clipboard-check', label: 'Practice Tests', sub: 'AI-made chapter tests' },
          { key: 'analytics', icon: 'trending-up', label: 'Progress Analytics', sub: 'See what is improving' }
        ]
      },
      {
        heading: 'PLAN',
        items: [
          { key: 'planner', icon: 'calendar', label: 'Study Planner', sub: 'Build your study timetable' },
          { key: 'alarms', icon: 'bell', label: 'Alarms & Reminders', sub: 'Never miss study time' },
          { key: 'notes', icon: 'notebook-pen', label: 'My Notes', sub: 'Everything you saved' }
        ]
      },
      {
        heading: 'MORE',
        items: [
          { key: 'team', icon: 'users', label: 'Meet Our Team', sub: 'Who built PHYSIX AI' },
          { key: 'about', icon: 'info', label: 'About Our Project', sub: 'School and project details' },
          { key: 'tour', icon: 'compass', label: 'Take App Tour', sub: 'A quick guided walkthrough' },
          { key: 'settings', icon: 'settings', label: 'Settings', sub: 'Profile, class and preferences' }
        ]
      }
    ];

    function renderSidebar() {
      const nav = document.getElementById('sidebar-nav');
      if (!nav) return;
      nav.innerHTML = NAV_GROUPS.map(g => `
        <div class="space-y-1.5">
          <p class="px-2 text-[10px] font-extrabold tracking-widest uppercase text-slate-500">${g.heading}</p>
          <div class="space-y-1">
            ${g.items.map(it => {
              const active = currentView === it.key;
              return `
                <button onclick="if('${it.key}'==='tour'){toggleMobileSidebar(false); openOnboarding(0);}else{navigateTo('${it.key}');}"
                  class="w-full px-3 py-2.5 rounded-2xl flex items-center gap-3 text-left transition ${active ? 'bg-cyan-500/15 border border-cyan-500/40' : 'hover:bg-slate-100 dark:hover:bg-[#11192e] border border-transparent'}">
                  <i data-lucide="${it.icon}" class="w-4 h-4 ${active ? 'text-cyan-400' : 'text-slate-400'} shrink-0"></i>
                  <div class="min-w-0">
                    <p class="text-xs font-extrabold truncate ${active ? 'text-cyan-300' : 'text-slate-800 dark:text-slate-200'}">${it.label}</p>
                    <p class="text-[10px] text-slate-400 truncate">${it.sub}</p>
                  </div>
                </button>
              `;
            }).join('')}
          </div>
        </div>
      `).join('');
    }

    function navigateTo(view) {
      currentView = view;
      toggleMobileSidebar(false);
      renderSidebar();
      renderCurrentView();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function renderCurrentView() {
      const main = document.getElementById('main-content');
      if (!main) return;
      switch (currentView) {
        case 'tutor': renderTutor(main); break;
        case 'chapters': renderChaptersPage(main); break;
        case 'dashboard': renderDashboard(main); break;
        case 'solver': renderNumericalSolver(main); break;
        case 'camera': renderCameraSolver(main); break;
        case 'lab': renderVirtualLab(main); break;
        case 'viewer3d': render3DViewer(main); break;
        case 'quiz': renderQuizSystem(main); break;
        case 'analytics': renderAnalytics(main); break;
        case 'planner': renderStudyPlanner(main); break;
        case 'alarms': renderAlarms(main); break;
        case 'notes': renderNotesPage(main); break;
        case 'team': renderTeam(main); break;
        case 'about': renderAboutProject(main); break;
        case 'settings': renderSettings(main); break;
        case 'diagrams':
          main.innerHTML = `<div class="space-y-4"><div class="space-y-1"><p class="text-[10px] font-extrabold uppercase tracking-widest text-cyan-400">VISUAL LEARNING</p><h1 class="text-2xl font-black text-white">Diagrams and graphs</h1><p class="text-xs text-slate-400">Every diagram is drawn as vector graphics, so labels stay sharp and zoom cleanly on a phone.</p></div>${Object.values(DIAGRAM_LIBRARY).map(d => `<div class="p-4 rounded-2xl bg-[#0d1425] border border-slate-800 space-y-2"><div class="flex items-center justify-between"><p class="text-xs font-extrabold text-cyan-400">${d.header}</p><button onclick="openZoomModal('${d.id}')" class="p-1.5 rounded-lg bg-slate-800 text-slate-300"><i data-lucide="maximize-2" class="w-3.5 h-3.5"></i></button></div>${d.svg}<p class="text-xs text-slate-400">${d.caption}</p></div>`).join('')}</div>`;
          break;
        case 'formulas':
          main.innerHTML = `<div class="space-y-3"><div class="space-y-1"><p class="text-[10px] font-extrabold uppercase tracking-widest text-cyan-400">FORMULA LIBRARY</p><h1 class="text-2xl font-black text-white">All formulas in one place</h1></div><div class="grid grid-cols-1 sm:grid-cols-2 gap-3">${[
            ['Wave Speed', 'v = f * lambda'], ['Simple Pendulum', 'T = 2*pi*sqrt(l/g)'],
            ["Coulomb's Law", 'F = k*q1*q2 / r^2'], ["Ohm's Law", 'V = I * R'],
            ['Lens Formula', '1/f = 1/p + 1/q'], ['Newton 2nd Law', 'F = m * a'],
            ['Weight', 'W = m * g'], ['Momentum', 'p = m * v'],
            ['Torque (moment of force)', 'τ = F × d'], ['Kinetic Energy', 'KE = ½ m v²']
          ].map(f => `<div class="p-4 rounded-2xl bg-[#0d1425] border border-slate-800"><p class="text-xs font-bold text-white">${f[0]}</p><p class="text-sm font-mono font-bold text-cyan-400 mt-1">${f[1]}</p></div>`).join('')}</div></div>`;
          break;
        default:
          renderTutor(main);
          break;
      }
      if (typeof lucide !== 'undefined') lucide.createIcons();
    }

    function toggleMobileSidebar(open) {
      const sb = document.getElementById('app-sidebar');
      const bd = document.getElementById('sidebar-backdrop');
      if (!sb || !bd) return;
      if (open) {
        sb.classList.remove('-translate-x-full');
        bd.classList.remove('hidden');
      } else {
        sb.classList.add('-translate-x-full');
        bd.classList.add('hidden');
      }
    }

    function toggleTheme() {
      appState.theme = appState.theme === 'dark' ? 'light' : 'dark';
      document.documentElement.classList.toggle('dark', appState.theme === 'dark');
      saveState();
      renderCurrentView();
    }

    function updateHeaderAvatar() {
      const btn = document.getElementById('header-avatar-btn');
      if (btn) btn.textContent = (appState.studentName || 'M')[0].toUpperCase();
    }

    function showToast(msg, type = 'info') {
      const box = document.getElementById('toast-container');
      if (!box) return;
      const el = document.createElement('div');
      const border = type === 'error' ? 'border-rose-500/50 text-rose-200' : type === 'success' ? 'border-emerald-500/50 text-emerald-200' : 'border-cyan-500/50 text-cyan-200';
      el.className = `px-4 py-2.5 rounded-2xl bg-[#0d1425]/95 border ${border} text-xs font-bold shadow-xl`;
      el.textContent = msg;
      box.appendChild(el);
      setTimeout(() => el.remove(), 3000);
    }

    function openZoomModal(diagId) {
      const d = DIAGRAM_LIBRARY[diagId] || DIAGRAM_LIBRARY.wave_motion;
      document.getElementById('zoom-modal-title').textContent = d.header;
      document.getElementById('zoom-modal-body').innerHTML = d.svg;
      document.getElementById('zoom-modal-caption').textContent = d.caption;
      document.getElementById('zoom-modal').classList.remove('hidden');
      if (typeof lucide !== 'undefined') lucide.createIcons();
    }

    function closeZoomModal() {
      document.getElementById('zoom-modal').classList.add('hidden');
    }

    function startVoiceInput() {
      const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SR) {
        showToast('Voice input is not supported in this browser.', 'error');
        return;
      }
      const rec = new SR();
      rec.lang = 'en-US';
      showToast('Listening... speak your Physics question', 'info');
      rec.onresult = (e) => {
        const transcript = e.results[0][0].transcript;
        submitTutorQuestion(transcript);
      };
      rec.start();
    }

    function openOnboarding(step) {
      const steps = [
        { title: 'Welcome to PHYSIX AI', desc: 'Your intelligent Sindh Board Class 9 & 10 Physics assistant with automatic labelled diagrams and 3D models.' },
        { title: 'AI Physics Tutor', desc: 'Ask any question in English, Urdu, Sindhi, or Roman Urdu and get step-by-step explanations with MAIN POINT highlights.' },
        { title: '3D Learning Lab & Virtual Experiments', desc: 'Rotate real 3D Physics models, inspect parts, and run live simulations.' },
        { title: 'Ready to Start!', desc: 'Developed at Govt Comprehensive Higher Secondary School, Sukkur under Sir Bilal Hussain.' }
      ];
      const s = steps[step] || steps[0];
      const modal = document.getElementById('onboarding-modal');
      document.getElementById('onboarding-content').innerHTML = `
        <div class="flex items-center justify-between">
          <span class="text-[10px] font-black tracking-widest uppercase text-cyan-400">STEP ${step + 1} OF ${steps.length}</span>
          <button onclick="document.getElementById('onboarding-modal').classList.add('hidden')" class="text-xs text-slate-400 hover:text-white">Skip</button>
        </div>
        <h2 class="text-xl font-black text-white">${s.title}</h2>
        <p class="text-xs sm:text-sm text-slate-300 leading-relaxed">${s.desc}</p>
        <div class="flex justify-between pt-2">
          ${step > 0 ? `<button onclick="openOnboarding(${step - 1})" class="px-4 py-2 rounded-full bg-slate-800 text-xs font-bold text-slate-200">Back</button>` : '<span></span>'}
          ${step < steps.length - 1
            ? `<button onclick="openOnboarding(${step + 1})" class="px-5 py-2 rounded-full bg-cyan-400 text-[#080d1a] text-xs font-black">Next</button>`
            : `<button onclick="document.getElementById('onboarding-modal').classList.add('hidden')" class="px-5 py-2 rounded-full bg-cyan-400 text-[#080d1a] text-xs font-black">Start Learning</button>`}
        </div>
      `;
      modal.classList.remove('hidden');
    }

    window.addEventListener('DOMContentLoaded', () => {
      document.documentElement.classList.toggle('dark', appState.theme === 'dark');
      updateHeaderAvatar();
      renderSidebar();
      renderCurrentView();
    });
  </script>
</body>
</html>
